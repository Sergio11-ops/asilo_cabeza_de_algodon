<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitudes Médicas - Cabeza de Algodón</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-pagina-roles="admin,medico_general,enfermero">
  <div class="app-shell">

    <!-- Navegación Lateral -->
   <!-- Rail de íconos -->
    <aside class="icon-rail">
      <div class="rail-logo">
        <img src="imagenes/logo.png" alt="Logo Cabeza de Algodón">
      </div>
      <nav class="rail-nav">
        <a class="rail-link" href="dashboard.html" title="Inicio" data-roles="admin,medico_general,especialista,enfermero,laboratorio,farmacia,caja,fundacion"><i class="bi bi-house-door-fill"></i></a>
        <a class="rail-link" href="registro_paciente.html" title="Gestión Pacientes" data-roles="admin,medico_general,especialista,enfermero"><i class="bi bi-person-plus"></i></a>
        <a class="rail-link" href="solicitud_medica.html" title="Solicitudes Médicas" data-roles="admin,medico_general,especialista,enfermero"><i class="bi bi-file-earmark-medical"></i></a>
        <a class="rail-link" href="agenda_fundacion.html" title="Agenda Fundación" data-roles="admin,fundacion"><i class="bi bi-calendar-check"></i></a>
        <a class="rail-link" href="visita_medica.html" title="Visitas y Especialidades" data-roles="admin,medico_general,especialista"><i class="bi bi-heart-pulse"></i></a>
        <a class="rail-link" href="laboratorio.html" title="Laboratorio" data-roles="admin,medico_general,especialista,laboratorio"><i class="bi bi-clipboard2-pulse"></i></a>
        <a class="rail-link" href="farmacia.html" title="Farmacia" data-roles="admin,medico_general,especialista,farmacia"><i class="bi bi-capsule"></i></a>
        <a class="rail-link" href="caja_donaciones.html" title="Caja y Donaciones" data-roles="admin,caja"><i class="bi bi-cash-coin"></i></a>
        <a class="rail-link" href="reportes.html" title="Reportes" data-roles="admin"><i class="bi bi-bar-chart-line"></i></a>
        <a class="rail-link" href="usuarios.html" title="Gestión de Usuarios" data-roles="admin"><i class="bi bi-people"></i></a>
      </nav>
      <div class="rail-bottom">
        <button id="btnCerrarSesion" class="rail-logout" title="Cerrar sesión"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </aside>

    <!-- Panel Principal -->
    <main class="main-panel">
      <header class="main-header d-flex justify-content-between align-items-center">
        <div>
          <p class="eyebrow-greeting">Fundación Cabeza de Algodón</p>
          <h1>Solicitudes Médicas</h1>
        </div>
        <div>
          <button class="btn-solid-brand" data-bs-toggle="modal" data-bs-target="#modalNuevaSolicitud" data-roles="admin,medico_general">
            <i class="bi bi-plus-lg me-1"></i> Nueva Solicitud
          </button>
        </div>
      </header>

      <!-- Estadísticas de Solicitudes -->
      <section class="stat-row">
        <div class="stat-pill tone-gold">
          <div class="stat-icon"><i class="bi bi-hourglass-split"></i></div>
          <div>
            <p class="stat-label">Pendientes</p>
            <p class="stat-value" id="statPendientes">0</p>
          </div>
        </div>
        <div class="stat-pill tone-sage">
          <div class="stat-icon"><i class="bi bi-check-circle"></i></div>
          <div>
            <p class="stat-label">Aprobadas</p>
            <p class="stat-value" id="statAprobadas">0</p>
          </div>
        </div>
        <div class="stat-pill tone-rose">
          <div class="stat-icon"><i class="bi bi-x-circle"></i></div>
          <div>
            <p class="stat-label">Rechazadas</p>
            <p class="stat-value" id="statRechazadas">0</p>
          </div>
        </div>
      </section>

      <!-- Tabla de Solicitudes -->
      <section class="panel-card">
        <div class="panel-card-header">
          <div class="filter-tabs">
            <button class="tab-btn active" data-estado="pendiente">Pendientes</button>
            <button class="tab-btn" data-estado="aprobada">Aprobadas</button>
            <button class="tab-btn" data-estado="rechazada">Rechazadas</button>
            <button class="tab-btn" data-estado="todas">Todas</button>
          </div>
          <span class="pill-count" id="pillCountSolicitudes">0 solicitudes</span>
        </div>
        <div class="table-responsive">
          <table class="table table-custom">
            <thead>
              <tr>
                <th>Paciente</th>
                <th>Especialidad Requerida</th>
                <th>Motivo de Solicitud</th>
                <th>Enfermero Acompañante</th>
                <th>Fecha Solicitud</th>
                <th>Estado</th>
                <th class="text-end">Acción</th>
              </tr>
            </thead>
            <tbody id="tablaSolicitudes">
              <tr>
                <td colspan="7" class="text-center text-muted py-4">Cargando solicitudes médicas...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- MODAL 1: Crear Nueva Solicitud Médica -->
  <div class="modal fade" id="modalNuevaSolicitud" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-file-earmark-plus me-2"></i>Crear Solicitud Médica</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="formNuevaSolicitud">
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Paciente Residente *</label>
                <select class="form-select" id="selectPaciente" required>
                  <option value="" disabled selected>Cargando pacientes...</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Especialidad Requerida *</label>
                <div class="input-group">
                  <select class="form-select" id="selectEspecialidad" required>
                    <option value="" disabled selected>Cargando especialidades...</option>
                  </select>
                  <button type="button" class="btn btn-outline-primary" id="btnNuevaEspecialidad" title="Agregar Nueva Especialidad">
                    <i class="bi bi-plus-lg"></i> Nueva
                  </button>
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Enfermero(a) Acompañante *</label>
                <select class="form-select" id="selectEnfermero" required>
                  <option value="" disabled selected>Cargando personal de enfermería...</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Prioridad</label>
                <select class="form-select" id="prioridadSolicitud">
                  <option value="Normal" selected>Normal</option>
                  <option value="Urgente">Urgente</option>
                </select>
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">Motivo de la remisión médica *</label>
                <textarea class="form-control" id="motivoSolicitud" rows="3" placeholder="Describa los síntomas o razón por la que se remite al especialista..." required></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary" id="btnGuardarSolicitud">Enviar Solicitud</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL 2: Aprobar / Programar Cita (Fundación) -->
  <div class="modal fade" id="modalAprobarSolicitud" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-calendar-check me-2"></i>Aprobar y Programar Cita</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="formAprobarSolicitud">
          <div class="modal-body">
            <input type="hidden" id="aprobar_id_solicitud">

            <div class="mb-3">
              <label class="form-label fw-semibold">Fecha y Hora Programada *</label>
              <input type="datetime-local" class="form-control" id="fechaHoraCita" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Observaciones de la Fundación</label>
              <textarea class="form-control" id="observacionesCita" rows="2" placeholder="Indicaciones para el traslado o atención..."></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-success">Confirmar y Programar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/solicitudes.js"></script>
</body>
</html>
