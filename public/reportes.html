<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes - Cabeza de Algodón</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    @media print {
      body * { visibility: hidden; }
      #printableReport, #printableReport * { visibility: visible; }
      #printableReport { position: absolute; left: 0; top: 0; width: 100%; color: #000 !important; background: #fff !important; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body data-pagina-roles="admin">
 <div class="app-shell">

    <!-- 1. Encabezado para Móvil con Botón Hamburguesa -->
    <header class="mobile-header d-md-none p-3 bg-white shadow-sm d-flex justify-content-between align-items-center w-100">
      <div class="d-flex align-items-center gap-2">
        <img src="imagenes/logo.png" alt="Logo" style="height: 32px; object-fit: contain;">
        <span class="fw-bold fs-6 text-dark">Cabeza de Algodón</span>
      </div>
      <button id="sidebar-toggle" class="btn btn-light rounded-circle border-0 shadow-sm" type="button" aria-label="Abrir menú">
        <i class="bi bi-list fs-3"></i>
      </button>
    </header>

    <!-- 2. Fondo oscuro al abrir menú en celular -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- 3. Rail de íconos -->
    <aside class="icon-rail" id="sidebar">
      <div class="rail-logo"><img src="imagenes/logo.png" alt="Logo Cabeza de Algodón"></div>
      <nav class="rail-nav">
        <a class="rail-link" href="dashboard.html" title="Inicio" data-roles="admin,medico_general,especialista,enfermero,laboratorio,farmacia,caja"><i class="bi bi-house-door-fill"></i></a>
        <a class="rail-link" href="registro_paciente.html" title="Gestión Pacientes" data-roles="admin,enfermero"><i class="bi bi-person-plus"></i></a>
        <a class="rail-link" href="solicitud_medica.html" title="Solicitudes Médicas" data-roles="admin,medico_general,especialista"><i class="bi bi-file-earmark-medical"></i></a>
        <a class="rail-link" href="agenda_fundacion.html" title="Agenda Fundación" data-roles="admin,medico_general,especialista,enfermero"><i class="bi bi-calendar-check"></i></a>
        <a class="rail-link" href="visita_medica.html" title="Visitas y Especialidades" data-roles="admin,medico_general,especialista"><i class="bi bi-heart-pulse"></i></a>
        <a class="rail-link" href="laboratorio.html" title="Laboratorio" data-roles="admin,medico_general,especialista,laboratorio"><i class="bi bi-clipboard2-pulse"></i></a>
        <a class="rail-link" href="farmacia.html" title="Farmacia" data-roles="admin,medico_general,especialista,farmacia"><i class="bi bi-capsule"></i></a>
        <a class="rail-link" href="caja_donaciones.html" title="Caja y Donaciones" data-roles="admin,caja"><i class="bi bi-cash-coin"></i></a>
        <a class="rail-link" href="reportes.html" title="Reportes" data-roles="admin"><i class="bi bi-bar-chart-line"></i></a>
        <a class="rail-link" href="usuarios.html" title="Gestión de Usuarios" data-roles="admin"><i class="bi bi-people"></i></a>
      </nav>
      <div class="rail-bottom">
        <button id="btnThemeToggle" class="rail-link mb-2" title="Cambiar Tema"><i class="bi bi-moon-stars-fill"></i></button>
        <button id="btnCerrarSesion" class="rail-logout" title="Cerrar sesión"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </aside>

    <main class="main-panel">
      <header class="main-header no-print">
        <div>
          <p class="eyebrow-greeting">Fundación Cabeza de Algodón</p>
          <h1>Módulo de Reportes Oficiales</h1>
        </div>
      </header>

      <!-- Panel de Selección de Reportes -->
      <section class="panel-card mb-4 no-print">
        <form id="formFiltrosReportes">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label fw-bold">Tipo de Reporte *</label>
              <select id="selectTipoReporte" class="form-select" required>
                <option value="">-- Seleccione un reporte --</option>
                <option value="costos_cita">1. Estadístico de Costos por Cita (Consultas, Exámenes y Fármacos)</option>
                <option value="analisis_medico">2. Análisis Médico por Paciente (Ficha Clínica y Diagnósticos)</option>
                <option value="cobros_paciente">3. Cobros por Paciente (Detalle de Gastos Médicos)</option>
                <option value="pagos_fundacion">4. Reporte de Pagos a la Fundación</option>
                <option value="entradas_donaciones">5. Reporte de Entradas (Donaciones y Cobros)</option>
                <option value="examenes_realizados">6. Exámenes Médicos Realizados por Paciente</option>
                <option value="medicamentos_aplicados">7. Medicamentos Aplicados / Entregados por Paciente</option>
              </select>
            </div>

            <div class="col-md-4" id="colPaciente">
              <label class="form-label fw-bold">Paciente</label>
              <select id="selectPaciente" class="form-select">
                <option value="">-- Todos los pacientes --</option>
              </select>
            </div>

            <div class="col-md-2" id="colFechaInicio">
              <label class="form-label fw-bold">Desde</label>
              <input type="date" id="inputFechaInicio" class="form-control">
            </div>

            <div class="col-md-2" id="colFechaFin">
              <label class="form-label fw-bold">Hasta</label>
              <input type="date" id="inputFechaFin" class="form-control">
            </div>

            <div class="col-12 text-end mt-3">
              <button type="submit" class="btn-solid-brand px-4 me-2"><i class="bi bi-file-earmark-bar-graph me-2"></i>Generar Reporte</button>
              <button type="button" id="btnImprimirReporte" class="btn-outline-brand px-4" disabled><i class="bi bi-printer me-2"></i>Imprimir / Guardar PDF</button>
            </div>
          </div>
        </form>
      </section>

      <!-- Vista Previa / Documento Imprimible -->
      <section class="panel-card bg-white p-4" id="printableReport">
        <div id="reporteContenido">
          <div class="text-center py-5 text-muted">
            <i class="bi bi-file-earmark-text display-4 d-block mb-3"></i>
            <p class="mb-0 fs-5">Seleccione las opciones arriba y presione <strong>Generar Reporte</strong>.</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/reportes.js"></script>
</body>
</html>
