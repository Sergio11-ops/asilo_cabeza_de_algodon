<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes - Cabeza de Algodón</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-pagina-roles="admin">
  <div class="app-shell">

    <aside class="icon-rail">
      <div class="rail-logo"><img src="imagenes/logo.png" alt="Logo Cabeza de Algodón"></div>
      <nav class="rail-nav">
        <a class="rail-link" href="dashboard.html" title="Inicio" data-roles="admin,medico,trabajo_social,caja,farmacia"><i class="bi bi-house-door-fill"></i></a>
        <a class="rail-link" href="registro_paciente.html" title="Gestión Pacientes" data-roles="admin,trabajo_social"><i class="bi bi-person-plus"></i></a>
        <a class="rail-link" href="solicitudes_medicas.html" title="Solicitudes Médicas" data-roles="admin,medico"><i class="bi bi-file-earmark-medical"></i></a>
        <a class="rail-link" href="agenda_fundacion.html" title="Agenda Fundación" data-roles="admin,medico,trabajo_social"><i class="bi bi-calendar-check"></i></a>
        <a class="rail-link" href="laboratorio.html" title="Laboratorio" data-roles="admin,medico"><i class="bi bi-clipboard2-pulse"></i></a>
        <a class="rail-link" href="farmacia.html" title="Farmacia" data-roles="admin,medico,farmacia"><i class="bi bi-capsule"></i></a>
        <a class="rail-link" href="caja_donaciones.html" title="Caja y Donaciones" data-roles="admin,caja"><i class="bi bi-cash-coin"></i></a>
        <a class="rail-link active" href="reportes.html" title="Reportes" data-roles="admin"><i class="bi bi-bar-chart-line"></i></a>
        <a class="rail-link" href="usuarios.html" title="Gestión de Usuarios" data-roles="admin"><i class="bi bi-people"></i></a>
      </nav>
      <div class="rail-bottom">
        <button id="btnCerrarSesion" class="rail-logout" title="Cerrar sesión"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </aside>

    <main class="main-panel">
      <header class="main-header">
        <div>
          <p class="eyebrow-greeting">Fundación Cabeza de Algodón</p>
          <h1>Reportes</h1>
        </div>
      </header>

      <section class="panel-card">
        <div class="form-section-title" style="margin-bottom: 0.5rem;">Filtrar por periodo</div>
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label">Desde</label>
            <input type="date" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label">Hasta</label>
            <input type="date" class="form-control">
          </div>
          <div class="col-md-3 d-flex align-items-end">
            <button class="btn-solid-brand w-100">Generar</button>
          </div>
        </div>
      </section>

      <section class="row g-3">
        <div class="col-md-6 col-xl-3">
          <div class="panel-card h-100">
            <div class="stat-icon mb-3" style="background-color: var(--brand-tint); color: var(--brand);"><i class="bi bi-people"></i></div>
            <h3 class="mb-1">Pacientes</h3>
            <p class="text-muted small mb-3">Altas, bajas y estado general de los residentes.</p>
            <button class="btn-outline-brand w-100"><i class="bi bi-download me-2"></i>Descargar PDF</button>
          </div>
        </div>
        <div class="col-md-6 col-xl-3">
          <div class="panel-card h-100">
            <div class="stat-icon mb-3" style="background-color: var(--gold-tint); color: var(--gold);"><i class="bi bi-calendar-check"></i></div>
            <h3 class="mb-1">Citas y Agenda</h3>
            <p class="text-muted small mb-3">Consultas atendidas, canceladas y pendientes.</p>
            <button class="btn-outline-brand w-100"><i class="bi bi-download me-2"></i>Descargar PDF</button>
          </div>
        </div>
        <div class="col-md-6 col-xl-3">
          <div class="panel-card h-100">
            <div class="stat-icon mb-3" style="background-color: var(--sage-tint); color: var(--sage);"><i class="bi bi-cash-coin"></i></div>
            <h3 class="mb-1">Financiero</h3>
            <p class="text-muted small mb-3">Donaciones, egresos y balance de caja.</p>
            <button class="btn-outline-brand w-100"><i class="bi bi-download me-2"></i>Descargar PDF</button>
          </div>
        </div>
        <div class="col-md-6 col-xl-3">
          <div class="panel-card h-100">
            <div class="stat-icon mb-3" style="background-color: var(--rose-tint); color: var(--rose);"><i class="bi bi-capsule"></i></div>
            <h3 class="mb-1">Farmacia</h3>
            <p class="text-muted small mb-3">Consumo de medicamentos e inventario.</p>
            <button class="btn-outline-brand w-100"><i class="bi bi-download me-2"></i>Descargar PDF</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
