<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Usuarios - Cabeza de Algodón</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-pagina-roles="admin">
  <div class="app-shell">

    <!-- Barra lateral de navegación -->
    <aside class="icon-rail">
      <div class="rail-logo"><img src="imagenes/logo.png" alt="Logo Cabeza de Algodón"></div>
      <nav class="rail-nav">
        <a class="rail-link" href="dashboard.html" title="Inicio" data-roles="admin,medico_general,especialista,enfermero,laboratorio,farmacia,caja"><i class="bi bi-house-door-fill"></i></a>
        <a class="rail-link" href="registro_paciente.html" title="Gestión Pacientes" data-roles="admin,enfermero"><i class="bi bi-person-plus"></i></a>
        <a class="rail-link" href="solicitud_medica.html" title="Solicitudes Médicas" data-roles="admin,medico_general,especialista"><i class="bi bi-file-earmark-medical"></i></a>
        <a class="rail-link" href="agenda_fundacion.html" title="Agenda Fundación" data-roles="admin,medico_general,especialista,enfermero"><i class="bi bi-calendar-check"></i></a>
        <a class="rail-link" href="visita_medica.html" title="Visitas y Especialidades" data-roles="admin,medico_general,especialista"><i class="bi bi-heart-pulse"></i></a>
        <a class="rail-link" href="laboratorio.html" title="Laboratorio" data-roles="admin,medico_general,especialista,laboratorio"><i class="bi bi-clipboard2-pulse"></i></a>
        <a class="rail-link" href="farmacia.html" title="Farmacia" data-roles="admin,medico_general,especialista,farmacia"><i class="bi bi-capsule"></i></a>
        <a class="rail-link" href="caja_donaciones.html" title="Caja y Donaciones" data-roles="admin,caja"><i class="bi bi-cash-coin"></i></a>
        <a class="rail-link" href="reportes.html" title="Reportes" data-roles="admin"><i class="bi bi-bar-chart-line"></i></a>
        <a class="rail-link active" href="usuarios.html" title="Gestión de Usuarios" data-roles="admin"><i class="bi bi-people"></i></a>
      </nav>
      <div class="rail-bottom">
        <button id="btnCerrarSesion" class="rail-logout" title="Cerrar sesión"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </aside>

    <main class="main-panel">
      <header class="main-header">
        <div>
          <p class="eyebrow-greeting">Fundación Cabeza de Algodón</p>
          <h1>Gestión de Usuarios</h1>
        </div>
        <div class="header-actions">
          <a href="#formSeccion" class="icon-btn filled" title="Ir a nuevo usuario"><i class="bi bi-plus-lg"></i></a>
        </div>
      </header>

      <!-- Alertas dinámicas de retroalimentación -->
      <div id="alertMensaje" class="alert alert-dismissible fade show d-none" role="alert">
        <span id="alertTexto"></span>
        <button type="button" class="btn-close" onclick="document.getElementById('alertMensaje').classList.add('d-none')"></button>
      </div>

      <!-- Tarjetas Estadísticas -->
      <section class="stat-row">
        <div class="stat-pill tone-brand">
          <div class="stat-icon"><i class="bi bi-people"></i></div>
          <div><p class="stat-label">Usuarios totales</p><p class="stat-value" id="statTotal">0</p></div>
        </div>
        <div class="stat-pill tone-sage">
          <div class="stat-icon"><i class="bi bi-person-check"></i></div>
          <div><p class="stat-label">Activos</p><p class="stat-value" id="statActivos">0</p></div>
        </div>
        <div class="stat-pill tone-gold">
          <div class="stat-icon"><i class="bi bi-shield-lock"></i></div>
          <div><p class="stat-label">Administradores</p><p class="stat-value" id="statAdmins">0</p></div>
        </div>
      </section>

      <!-- Tabla de Listado de Usuarios -->
      <section class="panel-card">
        <div class="panel-card-header">
          <h3>Listado de Usuarios</h3>
          <div class="search-bar">
            <i class="bi bi-search"></i>
            <input type="text" id="inputBuscar" class="form-control" placeholder="Buscar por nombre, correo o usuario...">
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-custom align-middle">
            <thead>
              <tr>
                <th>Usuario</th>
                <th>Correo</th>
                <th>Rol</th>
                <th>Estado</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaUsuariosBody">
              <tr>
                <td colspan="5" class="text-center py-4 text-muted">
                  <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                  Cargando usuarios...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Formulario de nuevo usuario -->
      <section class="panel-card" id="formSeccion">
        <div class="form-section-title">
          <span class="icon-circle"><i class="bi bi-person-plus"></i></span>
          Crear nuevo usuario
        </div>
        <form id="formNuevoUsuario">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Nombre <span class="text-danger">*</span></label>
              <input type="text" id="nombre" class="form-control" required placeholder="Ej. Ana">
            </div>
            <div class="col-md-4">
              <label class="form-label">Apellido <span class="text-danger">*</span></label>
              <input type="text" id="apellido" class="form-control" required placeholder="Ej. Gutiérrez">
            </div>
            <div class="col-md-4">
              <label class="form-label">Nombre de Usuario <span class="text-danger">*</span></label>
              <input type="text" id="usuario" class="form-control" required placeholder="Ej. agutierrez">
            </div>
            <div class="col-md-6">
              <label class="form-label">Correo electrónico <span class="text-danger">*</span></label>
              <input type="email" id="correo" class="form-control" required placeholder="usuario@asilo.org">
            </div>
            <div class="col-md-6">
              <label class="form-label">Contraseña <span class="text-danger">*</span></label>
              <input type="password" id="password" class="form-control" required minlength="6" placeholder="••••••••">
            </div>
            <div class="col-md-6">
              <label class="form-label">Rol <span class="text-danger">*</span></label>
              <select id="rol" class="form-select" required>
                <option value="" selected disabled>Seleccionar rol</option>
                <option value="admin">Administrador</option>
                <option value="medico_general">Médico General</option>
                <option value="especialista">Médico Especialista</option>
                <option value="enfermero">Enfermero/a</option>
                <option value="laboratorio">Laboratorio</option>
                <option value="farmacia">Farmacia</option>
                <option value="caja">Caja / Cobros</option>
                <option value="fundacion">Fundación</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Estado <span class="text-danger">*</span></label>
              <select id="activo" class="form-select" required>
                <option value="1" selected>Activo</option>
                <option value="0">Inactivo</option>
              </select>
            </div>
          </div>
          <div class="d-flex justify-content-end gap-2 mt-4">
            <button type="reset" class="btn-outline-brand">Cancelar</button>
            <button type="submit" class="btn-solid-brand" id="btnGuardar">Crear usuario</button>
          </div>
        </form>
      </section>
    </main>
    <!-- Modal para Editar Usuario -->
<div class="modal fade" id="modalEditarUsuario" tabindex="-1" aria-labelledby="modalEditarUsuarioLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="modalEditarUsuarioLabel"><i class="bi bi-pencil-square"></i> Editar Usuario</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="formEditarUsuario">
        <div class="modal-body">
          <input type="hidden" id="edit_id_usuario">
          
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label font-weight-bold">Nombre <span class="text-danger">*</span></label>
              <input type="text" id="edit_nombre" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label font-weight-bold">Apellido <span class="text-danger">*</span></label>
              <input type="text" id="edit_apellido" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label font-weight-bold">Nombre de Usuario <span class="text-danger">*</span></label>
              <input type="text" id="edit_usuario" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label font-weight-bold">Correo Electrónico <span class="text-danger">*</span></label>
              <input type="email" id="edit_correo" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label font-weight-bold">Rol <span class="text-danger">*</span></label>
              <select id="edit_rol" class="form-select" required>
                <option value="admin">Administrador</option>
                <option value="medico_general">Médico General</option>
                <option value="especialista">Médico Especialista</option>
                <option value="enfermero">Enfermero/a</option>
                <option value="laboratorio">Laboratorio</option>
                <option value="farmacia">Farmacia</option>
                <option value="caja">Caja / Cobros</option>
                <option value="fundacion">Fundación</option>
              </select>
            </div>
            <div class="col-md-12">
              <label class="form-label font-weight-bold">Nueva Contraseña <small class="text-muted">(Dejar en blanco para mantener la actual)</small></label>
              <input type="password" id="edit_password" class="form-control" placeholder="••••••••" minlength="6">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btnActualizarUsuario"><i class="bi bi-save"></i> Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Asegúrate de incluir el JS de Bootstrap antes de auth.js y usuarios.js si no lo tenías -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
