<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asilo Cabeza de Algodón - Iniciar Sesión</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <!-- Hoja de estilos de Login -->
  <link rel="stylesheet" href="../public/css/style_login.css">
</head>
<body>

  <div class="login-container">
    <!-- Encabezado con el Logo e Identidad de Marca -->
    <div class="login-header text-center mb-4">
      <img src="imagenes/logo.png" alt="Logo Asilo Cabeza de Algodón" class="app-logo mb-3">
      <h2>Cabeza de Algodón</h2>
      <p class="subtitle">Sistema de Gestión para el Asilo de Ancianos</p>
    </div>

    <!-- Formulario de Inicio de Sesión -->
    <form id="loginForm" novalidate>
      
      <!-- Campo 1: Correo Electrónico -->
      <div class="form-group mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="email" placeholder="ej. admin@asilo.org" required>
      </div>

      <!-- Campo 2: Contraseña con Toggle -->
      <div class="form-group mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" placeholder="Ingrese su contraseña" required>
          <button class="btn btn-outline-secondary btn-toggle-password" type="button" id="btnTogglePassword">
            <i class="bi bi-eye-fill" id="toggleIcon"></i>
          </button>
        </div>
      </div>

      <!-- Alerta de error -->
      <div id="errorAlert" class="alert alert-danger" style="display: none;" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span id="errorMessage">Credenciales incorrectas. Verifique usuario y contraseña.</span>
      </div>

      <!-- Botón de Acción Principal -->
      <div class="d-grid gap-2 mt-4">
        <button type="submit" class="btn btn-primary btn-custom" id="btnLogin">
          <span id="btnText"><i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión</span>
          <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2" style="display: none;" role="status"></span>
        </button>
      </div>

      <div class="login-footer text-center mt-4">
        <a href="#">¿Olvidó su contraseña? Contacte al administrador</a>
      </div>
    </form>
  </div>

  <!-- Archivo de Lógica de JavaScript Separado -->
  <script src="js/login.js"></script>
</body>
</html>
