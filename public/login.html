<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asilo Cabeza de Algodón - Iniciar Sesión</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <!-- Hoja de estilos mejorada 'DESPUÉS' -->
  <link rel="stylesheet" href="../public/css/styles.css">
</head>
<body>

  <div class="login-container">
    <!-- Encabezado con el Logo Local e Identidad de Marca -->
    <div class="login-header text-center mb-4">
      <img src="../public/imagenes/logo.png" alt="Logo Asilo Cabeza de Algodón" class="app-logo mb-3">
      <h2>Cabeza de Algodón</h2>
      <p class="subtitle">Sistema de Gestión para el Asilo de Ancianos</p>
    </div>

    <!-- Formulario Optimizado -->
    <form id="loginForm" novalidate>
      
      <!-- Campo 1: Con Label permanente e identificador claro -->
      <div class="form-group mb-3">
        <label for="email" class="form-label">Correo electrónico o usuario</label>
        <input type="email" class="form-control" id="email" placeholder="ej. maria.lopez@asilo.org">
      </div>

      <!-- Campo 2: Con Label e Icono para Mostrar/Ocultar Contraseña -->
      <div class="form-group mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" placeholder="Ingrese su contraseña">
          <button class="btn btn-outline-secondary btn-toggle-password" type="button" id="btnTogglePassword">
            <i class="bi bi-eye-fill" id="toggleIcon"></i>
          </button>
        </div>
      </div>

      <!-- Alerta de error clara y contextual -->
      <div id="errorAlert" class="alert alert-danger" style="display: none;" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span>Credenciales incorrectas. Verifique usuario y contraseña.</span>
      </div>

      <!-- Botón de acción principal con soporte para indicador de carga -->
      <div class="d-grid gap-2 mt-4">
        <button type="submit" class="btn btn-primary btn-custom" id="btnLogin">
          <span id="btnText"><i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión</span>
          <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2" style="display: none;" role="status"></span>
        </button>
      </div>

      <div class="login-footer text-center mt-4">
        <a href="#">¿Olvidó su contraseña? Contacte al administrador</a>
      </div>
    </form>
  </div>

  <script>
    // Alternar visibilidad de contraseña
    const btnToggle = document.getElementById('btnTogglePassword');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');

    btnToggle.addEventListener('click', function() {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      toggleIcon.className = isPassword ? 'bi bi-eye-slash-fill' : 'bi bi-eye-fill';
    });

    // Envío de formulario con indicador de carga
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      const alertBox = document.getElementById('errorAlert');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      btnText.textContent = "Verificando...";
      btnSpinner.style.display = "inline-block";

      setTimeout(() => {
        btnSpinner.style.display = "none";
        btnText.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión';

        if (!email || !pass) {
          alertBox.style.display = 'block';
        } else {
          alertBox.style.display = 'none';
          alert("Acceso concedido al sistema.");
        }
      }, 1000);
    });
  </script>
</body>
</html>
