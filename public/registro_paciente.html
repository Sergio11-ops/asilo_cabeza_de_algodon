<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Pacientes - Cabeza de Algodón</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-pagina-roles="admin,enfermero">
  <div class="app-shell">

    <aside class="icon-rail">
      <div class="rail-logo"><img src="imagenes/logo.png" alt="Logo Cabeza de Algodón"></div>
      <nav class="rail-nav">
        <a class="rail-link" href="dashboard.html" title="Inicio" data-roles="admin,medico_general,especialista,enfermero,laboratorio,farmacia,caja"><i class="bi bi-house-door-fill"></i></a>
        <a class="rail-link active" href="registro_paciente.html" title="Gestión Pacientes" data-roles="admin,enfermero"><i class="bi bi-person-plus"></i></a>
        <a class="rail-link" href="solicitudes_medicas.html" title="Solicitudes Médicas" data-roles="admin,medico_general,especialista"><i class="bi bi-file-earmark-medical"></i></a>
        <a class="rail-link" href="agenda_fundacion.html" title="Agenda Fundación" data-roles="admin,medico_general,especialista,enfermero"><i class="bi bi-calendar-check"></i></a>
        <a class="rail-link" href="laboratorio.html" title="Laboratorio" data-roles="admin,medico_general,especialista,laboratorio"><i class="bi bi-clipboard2-pulse"></i></a>
        <a class="rail-link" href="farmacia.html" title="Farmacia" data-roles="admin,medico_general,especialista,farmacia"><i class="bi bi-capsule"></i></a>
        <a class="rail-link" href="caja_donaciones.html" title="Caja y Donaciones" data-roles="admin,caja"><i class="bi bi-cash-coin"></i></a>
        <a class="rail-link" href="reportes.html" title="Reportes" data-roles="admin"><i class="bi bi-bar-chart-line"></i></a>
        <a class="rail-link" href="usuarios.html" title="Gestión de Usuarios" data-roles="admin"><i class="bi bi-people"></i></a>
      </nav>
      <div class="rail-bottom">
        <button id="btnCerrarSesion" class="rail-logout" title="Cerrar sesión"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </aside>

    <main class="main-panel">
      <header class="main-header">
        <div>
          <p class="eyebrow-greeting">Fundación Cabeza de Algodón</p>
          <h1>Gestión de Pacientes</h1>
        </div>
        <div class="header-actions">
          <button class="icon-btn filled" title="Buscar"><i class="bi bi-search"></i></button>
        </div>
      </header>

      <!-- Estadísticas -->
      <section class="stat-row">
        <div class="stat-pill tone-brand">
          <div class="stat-icon"><i class="bi bi-people"></i></div>
          <div>
            <p class="stat-label">Total de pacientes</p>
            <p class="stat-value">128</p>
          </div>
        </div>
        <div class="stat-pill tone-sage">
          <div class="stat-icon"><i class="bi bi-person-check"></i></div>
          <div>
            <p class="stat-label">Activos</p>
            <p class="stat-value">112</p>
          </div>
        </div>
        <div class="stat-pill tone-gold">
          <div class="stat-icon"><i class="bi bi-clipboard2-pulse"></i></div>
          <div>
            <p class="stat-label">En observación</p>
            <p class="stat-value">16</p>
          </div>
        </div>
      </section>

      <!-- Listado de pacientes -->
      <section class="panel-card">
        <div class="panel-card-header">
          <h3>Listado de Pacientes</h3>
          <div class="search-bar">
            <i class="bi bi-search"></i>
            <input type="text" class="form-control" placeholder="Buscar paciente...">
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-custom">
            <thead>
              <tr>
                <th>Paciente</th>
                <th>Edad</th>
                <th>Contacto</th>
                <th>Fecha de ingreso</th>
                <th>Estado</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaPacientes">
              <tr>
                <td colspan="6" class="text-center text-muted py-4">Cargando pacientes...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Formulario de registro -->
      <section class="panel-card">
        <div class="form-section-title">
          <span class="icon-circle"><i class="bi bi-person-plus"></i></span>
          Registrar nuevo paciente
        </div>
        <form id="formRegistroPaciente">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Nombre completo</label>
              <input type="text" class="form-control" id="nombrePaciente" placeholder="Ej. María Fernanda López" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Fecha de nacimiento</label>
              <input type="date" class="form-control" id="fechaNacimiento" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Género</label>
              <select class="form-select" id="genero" required>
                <option value="" selected disabled>Seleccionar</option>
                <option value="Femenino">Femenino</option>
                <option value="Masculino">Masculino</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Documento (DPI)</label>
              <input type="text" class="form-control" id="dpi" placeholder="0000 00000 0000">
            </div>
            <div class="col-md-4">
              <label class="form-label">Teléfono de contacto</label>
              <input type="text" class="form-control" id="telefonoContacto" placeholder="0000-0000">
            </div>
            <div class="col-md-4">
              <label class="form-label">Fecha de ingreso</label>
              <input type="date" class="form-control" id="fechaIngreso" required>
            </div>
          </div>

          <hr class="form-section-divider">

          <div class="form-section-title" style="font-size: 0.95rem;">
            <span class="icon-circle" style="width: 32px; height: 32px; font-size: 0.85rem;"><i class="bi bi-person-heart"></i></span>
            Contacto de emergencia
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Nombre del contacto</label>
              <input type="text" class="form-control" id="nombreContactoEmergencia" placeholder="Ej. Ana Solís" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Teléfono del contacto</label>
              <input type="text" class="form-control" id="telefonoContactoEmergencia" placeholder="0000-0000" required>
            </div>
          </div>

          <hr class="form-section-divider">

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Diagnóstico principal</label>
              <input type="text" class="form-control" id="diagnosticoPrincipal" placeholder="Ej. Hipertensión arterial">
            </div>
            <div class="col-md-6">
              <label class="form-label">Estado</label>
              <select class="form-select" id="estado">
                <option value="Activo">Activo</option>
                <option value="Por valorar">Por valorar</option>
                <option value="En observación">En observación</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Observaciones</label>
              <textarea class="form-control" id="observaciones" rows="3" placeholder="Notas adicionales sobre el paciente..."></textarea>
            </div>
          </div>

          <div id="errorAlertPaciente" class="alert alert-danger mt-3" style="display: none;" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span id="errorMessagePaciente"></span>
          </div>

          <div class="d-flex justify-content-end gap-2 mt-4">
            <button type="button" class="btn-outline-brand">Cancelar</button>
            <button type="submit" class="btn-solid-brand" id="btnGuardarPaciente">Guardar paciente</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/pacientes.js"></script>
</body>
</html>
